<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup • Abhyaas</title>
  <meta name="description" content="Create a new account on Abhyaas online examination portal." />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="shortcut icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/index.html">
        <img src="/assets/logo.png" class="brand-logo" alt="Abhyaas Logo" />
        <span>ABHYAAS</span>
      </a>
      <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/login.html" class="pill-button">Login</a>
      </nav>
    </div>
  </header>
  <main class="container auth-shell">
    <section class="auth-card single">
      <div class="auth-main">
        <h2 style="text-align: center; margin-bottom: 6px;">Create Account</h2>
        <p class="subtle" style="text-align: center; margin-bottom: 20px;">Sign up as a Student or Teacher</p>
        <form id="signup-form" class="form-grid">
          <div class="form-row">
            <label>Full name</label>
            <input type="text" name="name" placeholder="Enter full name" required />
          </div>
          <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 6 characters" required />
          </div>
          <div class="form-row">
            <label>Select role</label>
            <div class="radio-row">
              <label class="role-choice"><input type="radio" name="role" value="student" checked /> Student</label>
              <label class="role-choice"><input type="radio" name="role" value="teacher" /> Teacher</label>
            </div>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%; margin-top:8px;">Create Account</button>
          <div id="signup-message" class="notice hide"></div>
        </form>
        <p class="subtle" style="text-align:center; margin-top:16px;">Already have an account? <a href="/login.html" style="color:var(--sky); font-weight:700;">Login here</a>.</p>
      </div>
    </section>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
