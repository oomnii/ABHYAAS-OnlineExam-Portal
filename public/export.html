<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher PDF Export</title>
  <style>
    body { background: white; color: black; font-family: sans-serif; }
    .print-container { padding: 20px; max-width: 900px; margin: 0 auto; }
    @media print {
      .no-print { display: none; }
      body { background: white; }
    }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f5f5f5; color: #333; }
    .question-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .question-block p { margin: 5px 0; }
  </style>
</head>
<body>
  <div class="no-print" style="text-align: center; padding: 10px; background: #eee;">
    <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Print to PDF</button>
  </div>
  <div class="print-container" id="export-content">
    <h2 style="text-align:center">Loading Report...</h2>
  </div>
  <script type="module" src="/js/export.js"></script>
</body>
</html>
