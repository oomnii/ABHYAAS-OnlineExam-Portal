<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • Abhyaas</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="shortcut icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/index.html">
        <img src="/assets/logo.png" class="brand-logo" alt="Abhyaas Logo" />
        <span>ABHYAAS</span>
      </a>
      <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/signup.html" class="pill-button">Signup</a>
      </nav>
    </div>
  </header>
  <main class="container auth-shell">
    <section class="auth-card single">
      <div class="auth-main">
        <h2 style="text-align: center;">Login</h2>
        <form id="login-form" class="form-grid">
          <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required />
          </div>

          <button class="btn btn-primary" type="submit">Login</button>
          <div id="login-message" class="notice hide"></div>
        </form>
        <p class="subtle">New here? <a href="/signup.html" style="color:var(--navy); font-weight:700;">Create an account</a>.</p>
      </div>
    </section>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
